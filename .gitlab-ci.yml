workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == 'main3' && $CI_PIPELINE_SOURCE == 'push'

stages:
  - build

build-and-test-job:
  stage: build
  tags:
    - macos
  image: eclipse-temurin:21-jdk-jammy
  script:
    - echo "packaging the project..."
    - mvn package
  artifacts:
    paths:
      - target/*.jar
