workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == 'main' && $CI_PIPELINE_SOURCE == 'push'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

stages:
  - build
  - test

build-job:
  stage: build
  tags:
    - macos
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn package
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day

semgrep-sast:
  stage: test
  tags:
    - macos
  image: returntocorp/semgrep
  variables:
    GIT_STRATEGY: clone
  script:
    - semgrep scan --config=auto --gitlab-sast --output=gl-sast-report.json .
  artifacts:
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
    expire_in: 1 week

dependency-check:
  stage: test
  tags: [macos]
  image: maven:3.9-eclipse-temurin-21

  cache:
    key: "nvd-lib-cache"
    paths:
      - .dependency-check-data/
      -
  script:
    - mkdir -p target
    - mvn dependency-check:check -DdataDirectory=.dependency-check-data -DfailBuildOnCVSS=11 || true
    - touch target/dependency-check-report.html

  artifacts:
    paths: [target/dependency-check-report.html]
    expire_in: 1 week
    when: always

zap-baseline:
  stage: test
  tags: [macos]
  image:
    name: zaproxy/zap-stable
    entrypoint: [""]
  dependencies: [build-job]
  allow_failure: true
  script:
    - wget -q https://download.oracle.com/java/21/latest/jdk-21_linux-x64_bin.tar.gz
    - tar -xzf jdk-21_linux-x64_bin.tar.gz
    - export JAVA_HOME=$(pwd)/jdk-21.0.*
    - export PATH=$JAVA_HOME/bin:$PATH

    - java -jar target/*.jar &
    - sleep 30

    - touch zap-rules.tsv

    - /zap/zap-baseline.py -t http://localhost:8080 -r zap-baseline-report.html -c zap-rules.tsv -I || true
    - find /zap -name "zap-baseline-report.html" -exec cp {} . \; || true

  artifacts:
    paths: [zap-baseline-report.html]
    when: always
    expire_in: 1 week

zap-api:
  stage: test
  tags: [macos]
  image:
    name: zaproxy/zap-stable
    entrypoint: [""]
  dependencies: [build-job]
  allow_failure: true
  script:
    - wget -q https://download.oracle.com/java/21/latest/jdk-21_linux-x64_bin.tar.gz
    - tar -xzf jdk-21_linux-x64_bin.tar.gz
    - export JAVA_HOME=$(pwd)/jdk-21.0.*
    - export PATH=$JAVA_HOME/bin:$PATH

    - java -jar target/*.jar &
    - sleep 30
    - touch zap-rules.tsv

    - /zap/zap-api-scan.py -t http://localhost:8080/v3/api-docs -f openapi -r zap-api-report.html -c zap-rules.tsv -I || true
    - find /zap -name "zap-api-report.html" -exec cp {} . \; || true

  artifacts:
    paths: [zap-api-report.html]
    when: always
    expire_in: 1 week