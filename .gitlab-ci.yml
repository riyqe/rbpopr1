workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == 'main3' && $CI_PIPELINE_SOURCE == 'push'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

stages:
  - build
  - test

build-job:
  stage: build
  tags:
    - macos
  image: maven:3.9-eclipse-temurin-21
  script:
    - echo "пакуем наш проект..."
    - mvn package
    - sleep 30
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day

semgrep-sast:
  stage: test
  tags:
    - macos
  image: returntocorp/semgrep

  variables:
    GIT_STRATEGY: clone

  script:
    - semgrep scan --config=auto --gitlab-sast --output=gl-sast-report.json .

  artifacts:
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
    expire_in: 1 week

zap-baseline-scan:
  stage: test
  tags:
    - macos
  image:
    name: zaproxy/zap-stable:latest
    entrypoint: [""]
  dependencies:
    - build-job
  before_script:
    - apt-get update && apt-get install -y wget
    - wget -O app.jar "${CI_JOB_URL}/artifacts/raw/target/*.jar?job=build-job"
  script:
    - java -jar app.jar &
    - sleep 30
    - echo -e "WARN\tSkip\thttps://example.com" > rules.tsv
    - zap-baseline.py -t http://localhost:8080 -J zap-baseline-report.json -c rules.tsv
  artifacts:
    paths:
      - zap-baseline-report.json
    expire_in: 1 week
    when: always

zap-api-scan:
  stage: test
  tags:
    - macos
  image:
    name: zaproxy/zap-stable:latest
    entrypoint: [""]
  dependencies:
    - build-job
  before_script:
    - apt-get update && apt-get install -y wget
    - wget -O app.jar "${CI_JOB_URL}/artifacts/raw/target/*.jar?job=build-job"
  script:
    - java -jar app.jar &
    - sleep 30
    - echo -e "WARN\tSkip\thttps://example.com" > rules.tsv
    - zap-api-scan.py -t http://localhost:8080/v3/api-docs -f openapi -J zap-api-report.json -c rules.tsv
  artifacts:
    paths:
      - zap-api-report.json
    expire_in: 1 week
    when: always