name: Java CI Build and SAST

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    container: maven:3.9-eclipse-temurin-21
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Maven
        run: mvn -B package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-application
          path: target/*.jar

  sast:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    needs: build
    container: returntocorp/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config=auto --sarif --output=semgrep.sarif
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: always()

  dependency-check:
    name: SCA Analysis
    runs-on: ubuntu-latest
    needs: build
    container: maven:3.9-eclipse-temurin-21
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache NVD Data
        uses: actions/cache@v3
        with:
          path: .dependency-check-data
          key: nvd-data-${{ github.run_id }}
          restore-keys: |
            nvd-data-

      - name: Run OWASP Dependency Check
        run: |
          mkdir -p target
          mvn dependency-check:check -B -DdataDirectory="./.dependency-check-data" || true
          if [ ! -f target/dependency-check-report.html ]; then
            echo "<html><body><h1>Scan Failed (Network)</h1></body></html>" > target/dependency-check-report.html
          fi

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html


  dast-baseline:
    name: DAST Baseline Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: java-application
          path: target
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: |
          java -jar target/*.jar &
          sleep 30
          touch zap-rules.tsv
          touch zap-baseline-report.html
          chmod 777 zap-baseline-report.html zap-rules.tsv
      - name: Run ZAP Baseline via Docker
        run: |
          docker run --network="host" -v $PWD:/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t http://localhost:8080 -r zap-baseline-report.html -c zap-rules.tsv -I || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: zap-baseline-report.html

  dast-api:
    name: DAST API Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: java-application
          path: target
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: |
          java -jar target/*.jar &
          sleep 30
          touch zap-rules.tsv
          touch zap-api-report.html
          chmod 777 zap-api-report.html zap-rules.tsv
      - name: Run ZAP API via Docker
        run: |
          docker run --network="host" -v $PWD:/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
          -t http://localhost:8080/v3/api-docs -f openapi -r zap-api-report.html -c zap-rules.tsv -I || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-api-report
          path: zap-api-report.html