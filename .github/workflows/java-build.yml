name: Java CI Build and SAST

on:
  pull_request:
    branches: [ "main3" ]

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    container: maven:3.9-eclipse-temurin-21
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Build with Maven
        run: mvn -B package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-application
          path: target/*.jar

  sast:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest

    needs: build

    container: returntocorp/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config=auto --sarif --output=semgrep.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: always()

  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: java-application

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create empty rules file
        run: echo -e "WARN\tSkip\thttps://example.com" > rules.tsv

      - name: Start application
        run: |
          java -jar target/*.jar &
          sleep 30

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: 'rules.tsv'
          cmd_options: '-J'

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap-baseline-report.json

  zap-api:
    name: ZAP API Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: java-application

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create empty rules file
        run: echo -e "WARN\tSkip\thttps://example.com" > rules.tsv

      - name: Start application
        run: |
          java -jar target/*.jar &
          sleep 30

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'http://localhost:8080/v3/api-docs'
          format: 'openapi'
          rules_file_name: 'rules.tsv'
          cmd_options: '-J'

      - name: Upload ZAP API Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-api-report
          path: zap-api-scan-report.json