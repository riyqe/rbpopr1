name: Java CI Build and SAST

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    container: maven:3.9-eclipse-temurin-21
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Maven
        run: mvn -B package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-application
          path: target/*.jar

  sast:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    needs: build
    container: returntocorp/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config=auto --sarif --output=semgrep.sarif
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: always()

  dependency-check:
    name: SCA Analysis
    runs-on: ubuntu-latest
    needs: build
    container: maven:3.9-eclipse-temurin-21
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache NVD Data
        uses: actions/cache@v3
        with:
          path: .dependency-check-data
          key: nvd-data-${{ github.run_id }}
          restore-keys: |
            nvd-data-

      - name: Run OWASP Dependency Check
        run: |
          mkdir -p target
          mvn dependency-check:check -B -DdataDirectory="./.dependency-check-data" || true
          if [ ! -f target/dependency-check-report.html ]; then
            echo "<html><body><h1>Scan Failed (Network)</h1></body></html>" > target/dependency-check-report.html
          fi

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html


  dast-baseline:
    name: DAST Baseline Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: java-application
          path: target

      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Start Application
        run: |
          nohup java -jar target/*.jar > app.log 2>&1 &
          sleep 30
          touch zap-rules.tsv
          chmod 777 zap-rules.tsv

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:8080'
          rules_file_name: 'zap-rules.tsv'
          allow_issue_writing: false
          fail_action: false
          artifact_name: 'zap-baseline-report'

  dast-api:
    name: DAST API Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: java-application, path: target}
      - uses: actions/setup-java@v3
        with: {distribution: 'temurin', java-version: '21'}
      - run: |
          nohup java -jar target/*.jar > app.log 2>&1 &
          sleep 30
          touch zap-rules.tsv
          chmod 777 zap-rules.tsv

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:8080/v3/api-docs'
          format: openapi
          rules_file_name: 'zap-rules.tsv'
          allow_issue_writing: false
          fail_action: false

      - name: Upload API Report manually
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-api-report
          path: report_html.html