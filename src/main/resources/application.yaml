spring:
  application:
    name: course-management
  h2:
    console:
      # для лабы оставляем консоль, защитив Security
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false # запрещаем доступ внешним
  datasource:
    url: jdbc:h2:mem:courseapp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
management:
  endpoints:
    web:
      exposure:
        include: "health,info" # убираем звездочку, открываем только безопасные
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
app:
  plugin:
    url:
